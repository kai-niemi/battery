# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Needed to commit the updated coverage badges
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history and tags, for the commit info in git.properties
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml -B package --file pom.xml
      env:
        USER_NAME: ${{ secrets.USER_NAME }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    # Coverage and branch coverage badges from the JaCoCo report of the test phase
    - name: Generate coverage badges
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: .github/badges
        generate-branches-badge: true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

    # Only on main, since pull requests from forks can't push. Pushes made with the
    # GITHUB_TOKEN don't trigger another workflow run.
    - name: Commit coverage badges
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [[ -n "$(git status --porcelain .github/badges)" ]]; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/*.svg
          git commit -m "Update coverage badges"
          git push
        fi
