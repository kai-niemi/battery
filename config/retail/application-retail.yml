spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/battery
    username: root
    password:

battery:
  baseDir: config/retail

  before:
    steps:
      - name: Create Schema
        path: create-psql.sql

  phases:
    - name: Warm up phase
      duration: 60s
      users: 20
    - name: Steady state phase
      duration: 30s
    - name: Peak load phase
      duration: 30s
      startRate: 4
      maxRate: 30
      maxConcurrency: 64
    - name: Sustained peak phase
      duration: 1m
    - name: Cool down phase
      duration: 30s

  scenarios:
